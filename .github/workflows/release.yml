name: Release

# Push a tag like v0.4.0 (matching package.json) to publish to npm and JSR and create a GitHub Release.
# npm side, once: npmjs.com → package → Settings → Trusted publishing → GitHub Actions,
# repository akashgupta1909/temporal-workdays, workflow file release.yml. No npm token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Each step below is skipped when it is already done, so "Re-run failed jobs" is always safe.
      # prepublishOnly runs the full check (types, lint, tests, build, package lint, size, smoke).
      - name: Publish to npm with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "temporal-workdays@$version" version >/dev/null 2>&1; then
            echo "temporal-workdays@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
      # JSR side, once: create the @akashgupta1909 scope on jsr.io, create the package and link this
      # repository in its settings. Publishing then uses GitHub's OIDC token too.
      - name: Publish to JSR
        run: |
          version=$(node -p "require('./jsr.json').version")
          if curl -sf https://jsr.io/@akashgupta1909/temporal-workdays/meta.json |
            node -e "process.exit(JSON.parse(require('fs').readFileSync(0, 'utf8')).versions[process.argv[1]] ? 0 : 1)" "$version"; then
            echo "@akashgupta1909/temporal-workdays@$version is already on JSR"
          else
            npm run build
            npx jsr publish
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
